name: Test

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test-gradle-plugin:
    name: Test Gradle Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Run Gradle Plugin Tests
        run: ./gradlew :kameleon-gradle-plugin:test

  test-idea-plugin:
    name: Test IDEA Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Run IDEA Plugin Tests
        run: ./gradlew :kameleon-idea-plugin:test
